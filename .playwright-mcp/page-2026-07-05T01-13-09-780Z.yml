    - generic [ref=e46]:
      - generic [ref=e47]:
        - strong [ref=e48]: Huffman Static
        - text: Optimal prefix coding. Builds a frequency tree, assigns shortest codes to most frequent symbols. O(n log n) tree construction.
      - generic [ref=e49]:
        - strong [ref=e50]: Huffman Adaptive
        - text: Dynamic Huffman coding. Updates tree in real-time as data streams. No two-pass requirement.
      - generic [ref=e51]:
        - strong [ref=e52]: Arithmetic Coding
        - text: Fractional bit encoding. Maps entire message to a single number in [0,1). Superior compression ratios vs Huffman.
      - generic [ref=e53]:
        - strong [ref=e54]: BWT + RLE
        - text: Burrows-Wheeler Transform + Run-Length Encoding. BWT groups similar characters, RLE compresses runs.
      - generic [ref=e55]:
        - strong [ref=e56]: JPEG Compression
        - text: Discrete Cosine Transform + quantization. Chroma subsampling, zigzag scanning, Huffman coding of coefficients.
      - generic [ref=e57]:
        - strong [ref=e58]: K-means Compression
        - text: Color quantization via K-means clustering. Reduces color palette to K colors, maps each pixel to nearest centroid.
      - generic [ref=e59]:
        - strong [ref=e60]: PBIC
        - text: Patch-Based Image Compression. Divides image into patches, finds similar patches, encodes differences.
