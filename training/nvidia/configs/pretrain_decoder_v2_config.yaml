# Pretrain Decoder Configuration (v2)
model:
  architecture: decoder_only
  vocab_size: 65536
  hidden_dim: 4096
  num_layers: 32
  num_heads: 24
  max_seq_len: 8192
training:
  dataset: solana_code_and_tx_v2
  batch_size: 4
  gradient_accumulation: 8
  learning_rate: 1e-4
  warmup_steps: 4000
  num_epochs: 15
